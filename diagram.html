<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#4361ee"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="김비서"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <title>업무 프로세스 · 김비서</title>
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <style>
    :root {
      --bg-a: radial-gradient(ellipse at 18% 38%, rgba(99,102,241,.22) 0%, transparent 55%);
      --bg-b: radial-gradient(ellipse at 82% 14%, rgba(167,139,250,.18) 0%, transparent 50%);
      --bg-c: radial-gradient(ellipse at 58% 88%, rgba(59,130,246,.14) 0%, transparent 45%);
      --bg-base: linear-gradient(145deg,#e8edff 0%,#ede8ff 50%,#e4f0ff 100%);
      --card-bg: rgba(255,255,255,.72);
      --card-border: rgba(255,255,255,.60);
      --card-shadow: 0 8px 32px rgba(67,97,238,.12), 0 2px 8px rgba(67,97,238,.07);
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8080a0;
      --accent: #4361ee;
      --toggle-bg: rgba(255,255,255,.78);
      --toggle-border: rgba(255,255,255,.65);
      --toggle-shadow: 0 4px 18px rgba(0,0,0,.10);
    }
    html.dark {
      --bg-a: radial-gradient(ellipse at 18% 38%, rgba(99,102,241,.24) 0%, transparent 55%);
      --bg-b: radial-gradient(ellipse at 82% 14%, rgba(139,92,246,.20) 0%, transparent 50%);
      --bg-c: radial-gradient(ellipse at 58% 88%, rgba(59,130,246,.16) 0%, transparent 45%);
      --bg-base: #0f0f23;
      --card-bg: rgba(255,255,255,.065);
      --card-border: rgba(255,255,255,.10);
      --card-shadow: 0 8px 32px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.30);
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0c0;
      --text-muted: #606080;
      --accent: #818cf8;
      --toggle-bg: rgba(255,255,255,.08);
      --toggle-border: rgba(255,255,255,.13);
      --toggle-shadow: 0 4px 18px rgba(0,0,0,.40);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; transition: color .32s, background-color .32s, border-color .32s; }
    html { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      background: var(--bg-a), var(--bg-b), var(--bg-c), var(--bg-base);
      background-attachment: fixed;
      padding: 20px 20px 40px;
      color: var(--text-primary);
    }

    .theme-toggle {
      position: fixed; top: 20px; right: 20px;
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: var(--toggle-shadow);
      font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      transition: transform .22s, box-shadow .22s, background-color .32s, border-color .32s !important;
    }
    .theme-toggle:hover { transform: scale(1.14) rotate(14deg); }

    .page { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .nav-tabs {
      display: flex; gap: 5px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-radius: 18px; padding: 7px;
      box-shadow: var(--card-shadow); overflow-x: auto; scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 12px; text-decoration: none;
      font-size: 13px; font-weight: 700; color: var(--text-secondary);
      white-space: nowrap; flex-shrink: 0;
      transition: background-color .2s, color .2s, box-shadow .2s !important;
    }
    .nav-tab:hover { background: rgba(67,97,238,.08); color: var(--accent); }
    .nav-tab.active { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(67,97,238,.32); }
    html.dark .nav-tab.active { box-shadow: 0 4px 14px rgba(129,140,248,.28); }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-radius: 22px; padding: 24px;
      box-shadow: var(--card-shadow);
    }
    .card-title {
      font-size: 14px; font-weight: 900; color: var(--text-primary);
      margin-bottom: 20px; letter-spacing: -.2px;
    }
    .svg-wrap {
      overflow-x: auto; border-radius: 14px;
    }
    .svg-wrap img {
      display: block; width: 100%; min-width: 560px; max-width: 800px;
      margin: 0 auto; border-radius: 12px;
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="다크/라이트 모드">🌙</button>

<div class="page">

  <nav class="nav-tabs">
    <a href="dashboard.html" class="nav-tab">📊 대시보드</a>
    <a href="meeting-result.html" class="nav-tab">📝 회의록</a>
    <a href="chart.html" class="nav-tab">📈 매출 현황</a>
    <a href="diagram.html" class="nav-tab active">🔄 업무 프로세스</a>
    <a href="report.html" class="nav-tab">🔍 사이트 분석</a>
  </nav>

  <div class="card">
    <div class="card-title">🔄 업무 프로세스 플로우</div>
    <div class="svg-wrap">
      <img src="diagram.svg" alt="업무 프로세스: 기획 → 제작 → 검토 → 배포 → 분석"/>
    </div>
  </div>

</div>

<script>
  const html = document.documentElement;
  const btn  = document.getElementById('themeToggle');
  function applyTheme(dark) { html.classList.toggle('dark', dark); btn.textContent = dark ? '☀️' : '🌙'; }
  applyTheme(localStorage.getItem('theme') === 'dark');
  btn.addEventListener('click', () => {
    const isDark = html.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    btn.textContent = isDark ? '☀️' : '🌙';
  });
</script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
