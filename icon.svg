<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 배경 (maskable 아이콘용 safe zone 확보) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 클립보드 상단 -->
  <rect x="200" y="82" width="112" height="40" rx="20" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>

  <!-- 문서 카드 -->
  <rect x="116" y="100" width="280" height="300" rx="28" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- 할 일 항목 1 (완료) -->
  <circle cx="166" cy="194" r="15" fill="rgba(255,255,255,0.55)"/>
  <path d="M158 194 l5 6 l11 -11" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="195" y="186" width="148" height="14" rx="7" fill="rgba(255,255,255,0.82)" opacity="0.6"/>

  <!-- 할 일 항목 2 -->
  <circle cx="166" cy="242" r="15" fill="rgba(255,255,255,0.22)"/>
  <rect x="195" y="234" width="164" height="14" rx="7" fill="rgba(255,255,255,0.88)"/>

  <!-- 할 일 항목 3 -->
  <circle cx="166" cy="290" r="15" fill="rgba(255,255,255,0.22)"/>
  <rect x="195" y="282" width="128" height="14" rx="7" fill="rgba(255,255,255,0.75)"/>

  <!-- 할 일 항목 4 -->
  <circle cx="166" cy="338" r="15" fill="rgba(255,255,255,0.22)"/>
  <rect x="195" y="330" width="96" height="14" rx="7" fill="rgba(255,255,255,0.55)"/>

  <!-- 앱 이름 -->
  <text x="256" y="448"
        text-anchor="middle"
        font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        font-size="48" font-weight="800"
        fill="rgba(255,255,255,0.92)">김비서</text>
</svg>
